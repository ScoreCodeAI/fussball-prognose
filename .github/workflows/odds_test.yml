name: Test Odds API

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Test ausfuehren
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python odds_test.py
