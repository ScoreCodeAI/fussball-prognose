<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Score Code Agent</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060f;--panel:#0d1024;--panel2:#12163a;--line:#1f2552;--cy:#22e4ff;--vi:#a855f7;--mg:#e449ff;--gr:#2bf5a0;--rd:#ff4d7d;--tx:#e8ecff;--mu:#8a90c0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020309;font-family:Inter,sans-serif;color:var(--tx);display:flex;justify-content:center;padding:18px 0}
.phone{width:100%;max-width:420px;background:var(--bg);border-radius:34px;overflow:hidden;position:relative;
 box-shadow:0 0 0 1px #1c2150,0 0 60px #22e4ff22,0 0 120px #a855f71f}
.phone:before{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(transparent 0,transparent 3px,#22e4ff05 4px) 0 0/100% 4px,
 radial-gradient(600px 300px at 90% -5%,#a855f733,transparent 60%),radial-gradient(500px 300px at -10% 30%,#22e4ff22,transparent 60%)}
.wrap{position:relative;padding:0 16px 30px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 2px 6px;font-family:'JetBrains Mono';font-size:11px;color:var(--mu)}
.live{color:var(--gr);display:flex;gap:6px;align-items:center}.live i{width:7px;height:7px;border-radius:50%;background:var(--gr);box-shadow:0 0 10px var(--gr);animation:p 1.6s infinite}
@keyframes p{50%{opacity:.3}}
.logo{border-radius:20px;overflow:hidden;position:relative;margin:8px 0 14px;border:1px solid #22e4ff33}
.logo img{width:100%;display:block}
.logo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#22e4ff22,transparent);transform:translateX(-100%);animation:sh 4s infinite}
@keyframes sh{60%,100%{transform:translateX(100%)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;padding:8px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--mu)}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#22e4ff33,#a855f744);box-shadow:inset 0 0 0 1px #22e4ff88,0 0 18px #22e4ff33}
h3{font-family:Orbitron;font-size:12px;letter-spacing:2px;color:var(--cy);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase}
h3 span{font-family:Inter;letter-spacing:0;color:var(--mu);font-size:12px;text-transform:none;font-weight:500}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{position:relative;border-radius:18px;padding:14px;background:var(--panel);overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0;border-radius:18px;padding:1px;background:linear-gradient(140deg,var(--c1),transparent 60%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.kpi p{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}
.kpi b{display:block;font-family:Orbitron;font-size:24px;margin:6px 0 2px;color:var(--c1);text-shadow:0 0 18px var(--c1)}
.kpi small{font-size:11px;color:var(--gr)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:16px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mu);margin-top:6px}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* Hero Tipp */
.hero{position:relative;border-radius:26px;padding:18px 16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--vi) 35%,#0d1024),#0d1024 70%);border:1px solid color-mix(in srgb,var(--vi) 45%,transparent);box-shadow:0 0 40px color-mix(in srgb,var(--vi) 20%,transparent)}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px;background:#2bf5a01a;color:var(--gr);border:1px solid #2bf5a055}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:16px 0 8px;text-align:center}
.crest{width:58px;height:58px;margin:0 auto 8px;border-radius:18px;display:grid;place-items:center;font-family:Orbitron;font-weight:700;font-size:16px}
.tn{font-weight:600;font-size:14px}.ts{font-size:11px;color:var(--mu);margin-top:3px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cy) 0 72%,#ffffff14 72% 88%,var(--vi) 88%);box-shadow:0 0 30px color-mix(in srgb,var(--cy) 30%,transparent)}
.ring div{width:78px;height:78px;border-radius:50%;background:#0d1024;display:grid;place-items:center;text-align:center}
.ring b{font-family:Orbitron;font-size:22px;color:var(--cy)}.ring small{display:block;font-size:9px;color:var(--mu)}
.seg{display:flex;gap:4px;margin:14px 0 6px}.seg div{height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.mk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.m{background:#ffffff08;border:1px solid #ffffff12;border-radius:14px;padding:9px;text-align:center}
.m p{font-size:10px;color:var(--mu)}.m b{font-family:Orbitron;font-size:15px;display:block;margin-top:3px}
.val{margin-top:12px;display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-radius:14px;background:linear-gradient(90deg,#2bf5a022,#22e4ff11);border:1px solid #2bf5a055}
.val b{color:var(--gr);font-family:Orbitron;font-size:16px}
/* Match list */
.match{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #ffffff0d}
.match:last-child{border:0}
.time{font-family:'JetBrains Mono';font-size:11px;color:var(--mu);text-align:center;line-height:1.4}
.mt{font-size:14px;font-weight:600}.bar{display:flex;height:5px;border-radius:3px;overflow:hidden;margin-top:7px;gap:2px}
.pr{font-family:Orbitron;font-size:13px;text-align:right}.pr small{display:block;font-family:Inter;font-size:10px;color:var(--mu)}
.pill{font-size:10px;padding:3px 7px;border-radius:6px;margin-left:6px;font-weight:600;vertical-align:2px}
/* Result rows */
.res{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff0d;font-size:13px}
.res:last-child{border:0}.ok{color:var(--gr)}.no{color:var(--rd)}
.ic{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;margin-right:10px;font-weight:700;font-size:13px}
/* Models */
.mdl{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 0}
.rk{font-family:Orbitron;color:var(--mu);font-size:13px}
.track{height:6px;border-radius:3px;background:#ffffff10;margin-top:6px;overflow:hidden}.track i{display:block;height:100%;border-radius:3px}
.nav{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-around;padding:12px 8px;border-radius:22px;background:#0d1024e6;backdrop-filter:blur(12px);border:1px solid var(--line)}
.nav div{font-size:10px;color:var(--mu);text-align:center}.nav div.on{color:var(--cy);text-shadow:0 0 10px var(--cy)}
.nav svg{display:block;margin:0 auto 3px}
.mono{font-family:'JetBrains Mono'}

.mcard{position:relative;border-radius:22px;padding:16px;margin-bottom:12px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);cursor:pointer;transition:.2s}
.mcard:hover,.mcard:active{border-color:var(--c);box-shadow:0 0 28px color-mix(in srgb,var(--c) 35%,transparent);transform:translateY(-2px)}
.mrow{display:flex;gap:12px;align-items:center}
.mic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:Orbitron;font-weight:900;font-size:20px;color:#05060f;flex:none}
.mname{font-weight:700;font-size:15px}.msub{font-size:12px;color:var(--mu);margin-top:3px;line-height:1.4}
.arrow{font-size:26px;color:var(--mu)}
.mstat p{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}.mstat b{font-family:Orbitron;font-size:15px;display:block;margin-top:2px;margin-right:10px}
.back{color:var(--cy);font-size:13px;margin:4px 0 12px;cursor:pointer}
.mhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:4px;margin-top:14px;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.tab{flex:1;text-align:center;font-size:12px;padding:9px 4px;border-radius:10px;color:var(--mu);cursor:pointer}
.tab.on{background:linear-gradient(135deg,color-mix(in srgb,var(--cy) 22%,transparent),color-mix(in srgb,var(--vi) 28%,transparent));color:#fff;box-shadow:inset 0 0 0 1px var(--cy)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lcard{border-radius:20px;padding:16px 14px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);cursor:pointer;transition:.2s}
.lcard:active,.lcard:hover{border-color:var(--cy);box-shadow:0 0 24px #22e4ff44;transform:translateY(-2px)}
.flag{font-size:30px;margin-bottom:10px}
.crumb{font-size:12px;color:var(--mu);margin:2px 0 4px;font-family:'JetBrains Mono'}.crumb span{color:var(--cy);cursor:pointer}.crumb i{font-style:normal;margin:0 4px;opacity:.5}.crumb b{color:var(--tx);font-weight:600}
.switch{margin:10px 0 16px;padding:10px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--cy) 8%,transparent),color-mix(in srgb,var(--vi) 12%,transparent));border:1px solid color-mix(in srgb,var(--cy) 40%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--cy) 15%,transparent)}
.swl{font-family:Orbitron;font-size:10px;letter-spacing:2px;color:var(--cy);margin:0 0 8px 4px}
.swrow{display:flex;gap:6px}
.sw{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border-radius:12px;font-size:11px;color:var(--mu);cursor:pointer;border:1px solid transparent}
.sw.on{color:#fff;background:#05060fcc;border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 45%,transparent)}
.swi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:Orbitron;font-weight:900;color:#05060f;font-size:14px}

:root{transition:--cy .3s}
.homebar{display:flex;gap:8px;margin:2px 0 10px}
.hb,.hb2{padding:9px 14px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer}
.hb{color:#05060f;background:linear-gradient(135deg,#22e4ff,#a855f7);box-shadow:0 0 18px #22e4ff44}
.hb2{color:var(--tx);background:var(--panel);border:1px solid var(--line)}
.crumb{font-size:13px;margin:4px 0 6px}
.phone,.kpi b,.ring,.seg div,.mic{transition:all .35s}

:root{--yl:#ffd60a}
/* Logo-Welle verstaerkt */
.logo{isolation:isolate;animation:glow 5s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 34px #22e4ff44,0 0 60px #a855f733;border-color:#22e4ff77}}
.logo:after{display:none}
.beam{position:absolute;top:-20%;bottom:-20%;width:38%;pointer-events:none;mix-blend-mode:screen;filter:blur(6px);transform:translateX(-140%) skewX(-18deg)}
.b1{background:linear-gradient(90deg,transparent,#22e4ff55,#ffffff66,#22e4ff55,transparent);animation:sweep 3.6s cubic-bezier(.6,0,.3,1) infinite}
.b2{background:linear-gradient(90deg,transparent,#e449ff44,#a855f755,transparent);animation:sweep 3.6s cubic-bezier(.6,0,.3,1) 1.1s infinite;width:24%}
@keyframes sweep{0%{transform:translateX(-140%) skewX(-18deg)}70%,100%{transform:translateX(420%) skewX(-18deg)}}
.scan{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#22e4ffaa,transparent);box-shadow:0 0 12px #22e4ff;animation:scan 4.5s linear infinite;mix-blend-mode:screen}
@keyframes scan{0%{top:-4%}100%{top:104%}}
/* Tage */
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 10px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent)}
.day{flex:none;min-width:58px;text-align:center;padding:9px 6px 7px;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;position:relative}
.day b{display:block;font-family:Orbitron;font-size:11px;letter-spacing:1px;color:var(--mu)}.day span{font-size:13px;font-weight:600}
.day i{display:block;font-style:normal;font-size:10px;color:var(--mu);margin-top:2px}
.day.today b{color:var(--gr)}
.day.on{background:linear-gradient(160deg,color-mix(in srgb,var(--cy) 25%,var(--panel)),color-mix(in srgb,var(--vi) 25%,var(--panel)));border-color:var(--cy);box-shadow:0 0 18px color-mix(in srgb,var(--cy) 35%,transparent)}
.day.on b{color:#fff}
/* Modell-Umschalter */
.mswitch{display:flex;gap:6px;align-items:center;margin:4px 0 12px}
.msl{font-family:Orbitron;font-size:10px;letter-spacing:2px;color:var(--mu);margin-right:2px}
.mchip{display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--mu);cursor:pointer}
.mchip .swi{width:24px;height:24px;font-size:12px;border-radius:7px}
.mchip.on{color:#fff;border-color:var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 40%,transparent)}
.sumrow{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin:2px 2px 10px}.sumrow b{color:var(--tx)}
/* Akkordeon */
.acc{border-radius:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);margin-bottom:8px;overflow:hidden;transition:border-color .2s}
.acc.open{border-color:color-mix(in srgb,var(--cy) 50%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--cy) 14%,transparent)}
.acch{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.fl{font-size:24px}.accn{flex:1}.accn small{display:block;font-size:10px;letter-spacing:1.5px;color:var(--mu);font-weight:600}.accn b{font-size:15px}
.cnt{font-family:Orbitron;font-size:13px;color:var(--cy);background:color-mix(in srgb,var(--cy) 12%,transparent);padding:3px 9px;border-radius:8px}
.chev{color:var(--mu);font-size:18px;transition:transform .25s}.acc.open .chev{transform:rotate(180deg);color:var(--cy)}
.accb{padding:0 10px}.acc.open .accb{padding:0 10px 8px;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid #ffffff0d;cursor:pointer;border-radius:10px}
.row:active{background:#ffffff08}
.rt{font-size:12px;color:var(--mu);text-align:center}.rt b{color:var(--tx);font-size:14px}
.rm{font-size:13.5px;font-weight:500;line-height:1.55}
.rtip,.rchk{display:flex;flex-direction:column;align-items:flex-end;gap:4px;position:relative}
.tp{font-family:Orbitron;font-size:12px;color:#05060f;background:linear-gradient(90deg,var(--cy),color-mix(in srgb,var(--cy) 55%,#fff));padding:4px 9px;border-radius:8px;font-weight:700}
.ou{font-size:10.5px;color:var(--mu)}
.vd{position:absolute;top:-3px;left:-8px;width:8px;height:8px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr)}
.ck{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;font-family:'JetBrains Mono'}
.ck.y{background:#2bf5a01f;color:var(--gr)}.ck.n{background:#ff4d7d1f;color:var(--rd)}.ck.sm{font-size:10px;padding:2px 6px}
/* Detail */
.back{color:var(--cy);font-size:14px;font-weight:600;margin:4px 0 12px;cursor:pointer;display:inline-block;padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.vs{border-radius:24px;padding:16px;background:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--vi) 30%,#0d1024),#0d1024 75%);border:1px solid color-mix(in srgb,var(--vi) 40%,transparent)}
.vsd{text-align:center;font-size:11px;color:var(--mu)}
.vsg{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;margin:14px 0}
.vsm b{font-family:Orbitron;font-size:30px;color:#dfe4ff;text-shadow:0 0 18px color-mix(in srgb,var(--cy) 60%,transparent)}.vsm .score{color:var(--cy)}.vsm small{display:block;font-size:9px;color:var(--mu);letter-spacing:2px}
.crest{margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-family:Orbitron;font-weight:700;color:#fff}
.oddsrow{display:flex;justify-content:center;gap:8px}.oddsrow div{min-width:62px;text-align:center;padding:6px;border-radius:10px;background:#ffffff0c;border:1px solid #ffffff14}
.oddsrow small{display:block;font-size:10px;color:var(--mu)}.oddsrow b{font-family:'JetBrains Mono';font-size:14px}
.dtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:14px 0;padding:4px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.dt{flex:1 0 auto;text-align:center;font-size:12.5px;padding:9px 12px;border-radius:11px;color:var(--mu);cursor:pointer;white-space:nowrap}
.dt.on{color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c,#22e4ff) 28%,transparent),color-mix(in srgb,var(--vi) 22%,transparent));box-shadow:inset 0 0 0 1px var(--c,#ffffff55)}
.frow{display:grid;grid-template-columns:40px 22px 1fr auto 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #ffffff0d;font-size:12px}
.frow:last-child{border:0}.fd{color:var(--mu);font-size:10.5px}.fh{text-align:right;color:var(--mu)}.fa{color:var(--mu)}.me{color:var(--tx);font-weight:600}
.wdl{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#05060f}.wdl.S{background:var(--gr)}.wdl.U{background:#f5b82b}.wdl.N{background:var(--rd);color:#fff}
.checkrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
/* Top-Tipps */
.mchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
.hint{font-size:12px;color:var(--mu);margin:8px 2px;line-height:1.5}.hint b{color:var(--tx)}
.trow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #ffffff0d;cursor:pointer}.trow:last-child{border:0}
.tl small{font-size:10.5px;color:var(--mu)}.tl b{display:block;font-size:13.5px;margin-top:2px}
.tr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}.tr b{font-family:Orbitron;font-size:14px;color:var(--cy)}.tr small{font-size:11px;color:var(--mu)}
/* Modell Q */
.qsw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.qsw div{padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--mu);text-align:center;font-family:Orbitron;cursor:pointer}
.qsw div.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#f5b82b33,#ff7a4544);box-shadow:inset 0 0 0 1px #f5b82b99,0 0 18px #f5b82b33}
.qe{font-family:Orbitron;font-size:12px;color:var(--gr);background:#2bf5a014;border:1px solid var(--gr);padding:3px 8px;border-radius:8px;font-weight:700}
.qban{border-radius:18px;padding:14px 16px;margin-bottom:10px;background:linear-gradient(180deg,#2bf5a01a,#2bf5a00a);border:1px solid #2bf5a066;box-shadow:0 0 22px #2bf5a01f;color:var(--gr)}
.qban small{display:block;font-size:12px;color:var(--mu);letter-spacing:.05em}
.qban .big{font-family:Orbitron;font-size:22px;color:var(--gr);text-shadow:0 0 14px #2bf5a066}
.qer{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #2bf5a033;font-size:15px;color:var(--tx)}
.qer b{font-family:Orbitron;font-size:17px;color:var(--gr)}
/* Values */
.vsub{font-size:11.5px;color:var(--mu);margin-top:3px}.vsub b{color:var(--tx);font-family:Orbitron;font-size:12px}
.vbad{font-family:Orbitron;font-size:12px;padding:3px 8px;border-radius:8px;white-space:nowrap}
.vbad.mk{background:#2bf5a01f;color:var(--gr)}.vbad.md{background:#a78bfa24;color:#c4b5fd}.vbad.no{color:var(--mu);font-size:10.5px;font-family:inherit;padding:0}
/* Bilanz */
.bcard{border-radius:22px;padding:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid color-mix(in srgb,var(--cy) 35%,transparent);box-shadow:0 0 30px color-mix(in srgb,var(--cy) 12%,transparent)}

.opt.gold:after,.opt.gruen:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffff88 50%,transparent 70%);transform:translateX(-120%);animation:shine 2.6s ease-in-out infinite}

.dcg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.vsx:after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid transparent;border-top-color:var(--vi);border-bottom-color:var(--cy);animation:spin 3s linear infinite reverse}

.nm{font-family:Orbitron;font-weight:900;letter-spacing:1.5px;line-height:1.05;color:#f4fbff;text-align:center;word-break:break-word;
 text-shadow:0 0 4px #fff,0 0 12px var(--cy),0 0 26px var(--cy),0 0 44px color-mix(in srgb,var(--cy) 60%,transparent);animation:flick 6s infinite}

@keyframes tF{0%,90%,100%{transform:none;filter:none}91%{transform:skewX(-14deg) translateX(-2px);filter:brightness(2)}93%{transform:skewX(10deg) translateX(2px)}95%{transform:none;filter:brightness(1.6)}96%{filter:none}}

<script>
let D=null;const S={tag:null,modell:null,seite:"spiele",offen:new Set(),detail:null,dtab:null,markt:"tore"};
const $=id=>document.getElementById(id);
const TAGE=["SO","MO","DI","MI","DO","FR","SA"];
const pc=x=>x==null?"–":Math.round(x)+"%";
const dm=d=>{const t=new Date(d+"T12:00:00");return String(t.getDate()).padStart(2,"0")+"."+String(t.getMonth()+1).padStart(2,"0")+"."};
const wd=d=>TAGE[new Date(d+"T12:00:00").getDay()];
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
function neon(t,side){const n=t.toUpperCase(),w=n.split(" ");const main=w.length>1&&n.length>9?w.slice(0,-1).join(" "):n,sub=w.length>1&&n.length>9?w[w.length-1]:"";
 const L=main.length,fs=L<=7?19:L<=10?16:L<=13?13:11;
 return `<div class="nn ${side}"><span class="nm tg" data-t="${sub?main:n}" style="font-size:${fs}px">${sub?main:n}</span>${sub?`<span class="ns tg" data-t="${sub}">${sub}</span>`:""}<i class="nl"></i></div>`}
function crest(t,sz=58){const h=hash(t)%360,w=t.replace(/[^A-Za-zÄÖÜäöüß' ]/g,"").split(" ").filter(Boolean);
 const k=(w.length>1?w.map(x=>x[0]).join(""):t.replace(/[^A-Za-z]/g,"")).slice(0,3).toUpperCase();
 return `<div class="crest" style="width:${sz}px;height:${sz}px;font-size:${sz/3.6}px;background:linear-gradient(140deg,hsl(${h} 75% 52%),hsl(${(h+40)%360} 70% 28%));box-shadow:0 0 18px hsl(${h} 80% 50% / .4)">${k}</div>`}
const M=()=>D.modelle.find(m=>m.id==S.modell);
function theme(m){const r=document.documentElement.style;r.setProperty("--cy",m.farbe1);r.setProperty("--vi",m.farbe2)}
const ligaInfo={};
const P=(s,id=S.modell)=>s.prog[id];
function res(s){if(!s.ergebnis)return null;const[a,b]=s.ergebnis.split(":").map(Number);let hh=null,ha=null;if(s.ergebnis_ht){[hh,ha]=s.ergebnis_ht.split(":").map(Number)}return{h:a,a:b,hh,ha,txt:s.ergebnis}}
function fav(p){return p.p1>=p.px&&p.p1>=p.p2?["1",p.p1]:p.p2>=p.px?["2",p.p2]:["X",p.px]}
function hit(mk,p,r){if(!r||!p)return null;const t=r.h+r.a;switch(mk){
 case"1x2":{const f=fav(p)[0];return f=="1"?r.h>r.a:f=="2"?r.h<r.a:r.h==r.a}
 case"ou":return p.ue25>=50?t>2:t<=2;
 case"bts":return p.bts>=50?(r.h>0&&r.a>0):!(r.h>0&&r.a>0);
 case"ht":{if(!p.ht||r.hh==null)return null;const m=Math.max(...p.ht),f=p.ht.indexOf(m);return f==0?r.hh>r.ha:f==2?r.hh<r.ha:r.hh==r.ha}
 case"ht2":{if(!p.ht2||r.hh==null)return null;const m=Math.max(...p.ht2),f=p.ht2.indexOf(m);return f==0?(r.h-r.hh)>(r.a-r.ha):f==2?(r.h-r.hh)<(r.a-r.ha):(r.h-r.hh)==(r.a-r.ha)}}}
const sg=(a,b)=>a>b?"1":a<b?"2":"X";
/* Treffer eines Vorteil-Tipps: Markt + Label */
function vhit(mk,lab,r){if(!r)return null;const t=r.h+r.a;switch(mk){
 case"1x2":return lab==sg(r.h,r.a);
 case"ou":return lab.startsWith("OVER")?t>2:t<=2;
 case"bts":return (lab=="Ja")==(r.h>0&&r.a>0);
 case"ht":return r.hh==null?null:lab=="HZ1 "+sg(r.hh,r.ha);
 case"ht2":return r.hh==null?null:lab=="HZ2 "+sg(r.h-r.hh,r.a-r.ha)}}
/* echte Quote (falls vorhanden), sonst Markt-Quote ohne Marge */
function vquote(s,mk,v){const q=s.quoten||{};if(mk=="1x2"&&q[v[0]])return[q[v[0]],1];
 if(mk=="ou"){const k=v[0].startsWith("OVER")?"Ü2.5":"U2.5";if(q[k])return[q[k],1]}return[+(100/v[2]).toFixed(2),0]}
const VTM=[["1x2","🏆 1X2"],["ou","⚽ OVER / UNDER"],["bts","🤝 BTTS"],["ht","⏱ 1. Halbzeit"],["ht2","⏱ 2. Halbzeit"]];
const kom=x=>String(x).replace(".",",");
/* ---------- O/U · Bester Vorteil aus allen Modellen ---------- */
const isOU=id=>(D.modelle.find(m=>m.id==id)||{}).typ=="oubest";
const ouLab=t=>t.startsWith("OVER")?"OVER":"UNDER";
function ouRow(s){const p=P(s),r=res(s);
 const left=`<div class="row" onclick="openDetail(${s.id})"><div class="rt mono">${r?`<b>${s.ergebnis}</b>`:s.zeit}</div><div class="rm"><div>${s.heim}</div><div>${s.gast}</div></div>`;
 if(!p)return left+`<div class="rtip"><span class="ou">kein Vorteil</span></div></div>`;
 const b=p.liste[0],h=r?vhit("ou",b.tipp,r):null;
 return left+`<div class="rtip"><span class="qe">${ouLab(b.tipp)} +${kom(b.v)}%${h!=null?(h?" ✓":" ✕"):""}</span><span class="ou">${b.modell} · ${p.liste.length} Modell${p.liste.length>1?"e":""}</span></div></div>`}
function ouCard(s,p){const r=res(s);if(!p)return `<div class="pcard"><div class="card"><p class="msub">Kein Modell sieht bei OVER/UNDER einen Vorteil gegenüber dem Markt.</p></div></div>`;
 const b=p.liste[0],h=r?vhit("ou",b.tipp,r):null,[q,echt]=vquote(s,"ou",[b.tipp,b.pm,b.pk]);

 const rows=l.map(([s,b])=>{const r=res(s),h=eHit(b[3],s.ecken);if(h!=null){n++;if(h)ok++}const fl=D.laender.find(z=>z.ligen.some(g=>g.code==s.liga));
  return `<div class="trow" onclick="S.dtab='ecken';openDetail(${s.id});S.dtab='ecken';renderDetail()"><div class="tl"><small>${fl?fl.flagge:""} ${ligaInfo[s.liga]} · ${r?s.ergebnis:s.zeit}</small><b>${s.heim} – ${s.gast}</b><div class="vsub">${b[0]} · erwartet ${kom(s.prog.ecken.xh)} : ${kom(s.prog.ecken.xa)}${s.ecken?` · Ecken ${s.ecken[0]}:${s.ecken[1]}`:""}</div></div>
  <div class="tr"><span class="ttop ${h==null?'':h?'y':'n'}">${b[0].replace("Ecken ","")} · ${b[1]}${h!=null?(h?" ✓":" ✕"):""}</span><span class="vbad mk">${kom(b[2])}%</span></div></div>`}).join("");
 $("vlist").innerHTML=`<p class="hint">Je Spiel die <b>stärkste Ecken-Prognose</b> – jedes Spiel nur einmal, höchste Wahrscheinlichkeit zuerst.</p>
 <h3>🚩 Top Ecken <span>${n?`${ok} / ${n} richtig`:`${l.length} Spiele`}</span></h3>`+(l.length?`<div class="card hell" style="padding:4px 14px">${rows}</div>`:`<div class="card"><p class="msub">Keine Ecken-Prognosen an diesem Tag.</p></div>`)}
function renderBilanzE(fertig,chips,von,bis){const st={};let w=0,n=0;
 for(const s of fertig){const e=s.prog.ecken;if(!e||!s.ecken)continue;const b=eBest(e,s),h=eHit(b[3],s.ecken);n++;if(h)w++;
  for(const o of eOpt(e)){const g=o[0]+" "+o[1].split(" ")[1];const x=st[g]=st[g]||[0,0];if(o[2]>=50){x[1]++;if(eHit(o[3],s.ecken))x[0]++}}}
 $("bilanz").innerHTML=`${chips}<p class="hint">${S.btag?`Nur <b>${wd(S.btag)} ${dm(S.btag)}</b>`:`Die <b>letzte Spielwoche (${dm(von)}–${dm(bis)})</b>`}: Ecken-Prognosen gegen die echten Ecken.</p>
 <div class="bcard"><div class="bh"><div style="flex:1"><b>🚩 Top-Ecken-Tipp je Spiel</b><small>${n} Spiele</small></div><b class="big">${n?Math.round(w/n*100):0}%</b></div><div class="wl"><span class="won">${w} Richtig</span><span class="lost">${n-w} Falsch</span></div></div>
 <h3>Treffer je Markt <span>Tipp = Seite über 50 %</span></h3><div class="card" style="padding:4px 14px">${Object.entries(st).map(([k,[a,c]])=>`<div class="trow" style="cursor:default"><div class="tl"><b>${k}</b><small>${a} / ${c} richtig</small></div><div class="tr"><b class="mono">${c?Math.round(a/c*100)+"%":"–"}</b></div></div>`).join("")}</div>`}

function renderTopVorteil(){const mk=VT_KEY[S.markt],tag=D.spiele.filter(s=>s.datum==S.tag),done=tag.length&&tag[0].ergebnis!=null;
 const l=tag.filter(s=>P(s).vt&&P(s).vt[mk]).map(s=>[s,P(s).vt[mk]]).sort((a,b)=>b[1][3]-a[1][3]);
 const name=VTM.find(x=>x[0]==mk)[1];
 $("toplist").innerHTML=`<p class="hint"><b>Größter Vorteil</b>: Spiele, bei denen Modell <b>${M().kurz}</b> eine höhere Chance sieht als der Markt (Pinnacle ohne Marge) – nicht der Favorit, sondern die größte Abweichung.${done?" Rückblick mit Ergebnis.":""}</p>
 <h3>${name} <span>${l.length} Spiele</span></h3>`+(l.length?`<div class="card" style="padding:4px 14px">${l.slice(0,15).map(([s,v])=>{const r=res(s),h=vhit(mk,v[0],r),[q,echt]=vquote(s,mk,v),fl=D.laender.find(x=>x.ligen.some(g=>g.code==s.liga));
  return `<div class="trow" onclick="openDetail(${s.id})"><div class="tl"><small>${fl?fl.flagge:""} ${ligaInfo[s.liga]} · ${r?s.ergebnis:s.zeit}</small><b>${s.heim} – ${s.gast}</b>
  <div class="vsub">Modell ${kom(v[1])}% · Markt ${kom(v[2])}% · ${echt?"Quote":"Markt ≈"} <b>${kom(q)}</b></div></div>
  <div class="tr"><b class="mono">${v[0]}</b><span class="vbad mk">+${kom(v[3])}%</span>${h!=null?`<span class="ck ${h?'y':'n'}">${h?'✓':'✕'}</span>`:""}</div></div>`}).join("")}</div>`:`<div class="card"><p class="msub">Kein Vorteil in diesem Markt – Modell und Markt sind sich einig.</p></div>`)}

/* ---------- Bilanz: nur letzte Spielwoche ---------- */
function renderBilanz(){const alle=D.spiele.filter(s=>s.ergebnis);if(!alle.length){$("bilanz").innerHTML=`<div class="card"><p class="msub">Noch keine abgeschlossene Spielwoche.</p></div>`;return}
 const tage=[...new Set(alle.map(s=>s.datum))].sort(),von=tage[0],bis=tage[tage.length-1];
 if(S.btag&&!tage.includes(S.btag))S.btag=null;
 const fertig=S.btag?alle.filter(s=>s.datum==S.btag):alle;
 const chipsQ=`<div class="bdays"><div class="bday${!S.btag?' on':''}" onclick="S.btag=null;renderBilanz()"><b>WOCHE</b><span>${dm(von)}–${dm(bis)}</span></div>`+tage.map(d=>`<div class="bday${S.btag==d?' on':''}" onclick="S.btag='${d}';renderBilanz()"><b>${wd(d)}</b><span>${dm(d)}</span><i>${alle.filter(s=>s.datum==d).length}</i></div>`).join("")+`</div>`;
 if(isMM(S.modell)||isQL(S.modell))return renderBilanzMM(fertig,chipsQ,von,bis);
 if(isQ(S.modell))return renderBilanzQ(alle,fertig,chipsQ,von,bis);
 if(isSV(S.modell))return renderBilanzSV(fertig,chipsQ,von,bis);
 if(isOU(S.modell))return renderBilanzOU(fertig,chipsQ,von,bis);
 if(isE(S.modell))return renderBilanzE(fertig,chipsQ,von,bis);
 if(isL(S.modell))return renderBilanzL(fertig,chipsQ,von,bis);
 const MK=[["1x2","Spielausgang"],["ht","1. Halbzeit"],["ou","OVER/UNDER 2,5"],["bts","Beide treffen"],["ht2","2. Halbzeit"]];
 const stat=(list,k,mid=S.modell)=>{let w=0,n=0;for(const s of list){if(!P(s,mid))continue;const h=hit(k,P(s,mid),res(s));if(h==null)continue;n++;if(h)w++}return[w,n-w]};
 const rate=([w,l])=>w+l?Math.round(w/(w+l)*100):null;
 const all=MK.map(([k])=>stat(fertig,k)),W=all.reduce((a,x)=>a+x[0],0),L=all.reduce((a,x)=>a+x[1],0);
 const chips=`<div class="bdays"><div class="bday${!S.btag?' on':''}" onclick="S.btag=null;renderBilanz()"><b>WOCHE</b><span>${dm(von)}–${dm(bis)}</span></div>`+
  tage.map(d=>`<div class="bday${S.btag==d?' on':''}" onclick="S.btag='${d}';renderBilanz()"><b>${wd(d)}</b><span>${dm(d)}</span><i>${alle.filter(s=>s.datum==d).length}</i></div>`).join("")+`</div>`;
 const rk=D.modelle.filter(m=>!m.typ).map(m=>{const st=MK.map(([k])=>stat(fertig,k,m.id)),w=st.reduce((a,x)=>a+x[0],0),l=st.reduce((a,x)=>a+x[1],0);let rs=0,rn=0;for(const s of fertig){const p=P(s,m.id),r=res(s);if(!p||!r)continue;const o=r.h>r.a?0:r.h==r.a?1:2,a1=p.p1/100,ax=p.px/100;rs+=((a1-(o==0))**2+(a1+ax-(o<=1))**2)/2;rn++}return{m,st,g:w+l?w/(w+l):0,rps:rn?rs/rn:null}}).sort((a,b)=>b.g-a.g);
 const ranking=rk.map((x,i)=>`<div class="rkrow${x.m.id==S.modell?' on':''}" style="--c:${x.m.farbe1}" onclick="S.modell='${x.m.id}';render()">
  <span class="rkn${i==0?' gold':i==1?' silver':i==2?' bronze':''}">${i+1}</span>
  <span class="swi" style="background:linear-gradient(140deg,${x.m.farbe1},${x.m.farbe2});width:34px;height:34px;font-size:15px">${x.m.icon}</span>
  <div class="rkm"><b>${x.m.name}</b><div class="rkmk">${MK.slice(0,4).map(([k,n],j)=>{const r=rate(x.st[j]);return `<span>${["1X2","HZ1","O/U","BTS"][j]} <em class="${r==null?'':r>=50?'ok':'no'}">${r==null?'–':r+'%'}</em></span>`}).join("")}<span>RPS <em>${x.rps==null?'–':x.rps.toFixed(3).replace(".",",")}</em></span></div>
  <div class="track"><i style="width:${Math.round(x.g*100)}%;background:linear-gradient(90deg,${x.m.farbe1},${x.m.farbe2})"></i></div></div>
  <b class="rkp" style="color:${x.m.farbe1}">${Math.round(x.g*100)}%</b></div>`).join("");
 $("bilanz").innerHTML=`${chips}<p class="hint">${S.btag?`Nur <b>${wd(S.btag)} ${dm(S.btag)}</b>`:`Die <b>letzte Spielwoche (${dm(von)}–${dm(bis)})</b>`}: Prognosen, die vor den Spielen feststanden, gegen die echten Ergebnisse.</p>
 <h3>🏆 Modell-Ranking <span>${fertig.length} Spiele</span></h3><div class="card" style="padding:6px 12px">${ranking}</div>
 <h3>Details <span>${M().kurz}</span></h3>
 <div class="bcard"><div class="bh"><span class="swi" style="background:linear-gradient(140deg,${M().farbe1},${M().farbe2});width:40px;height:40px;font-size:18px">${M().icon}</span><div style="flex:1"><b>${M().name}</b><small>${fertig.length} Spiele · ${W+L} Tipps</small></div><b class="big">${W+L?Math.round(W/(W+L)*100):0}%</b></div>
 <div class="wl"><span class="won">${W} Richtig</span><span class="lost">${L} Falsch</span></div>
 <div class="mbl">TREFFER JE WETTMARKT</div>
 <div class="grid2">${MK.map(([k,n],i)=>{const[w,l]=all[i],r=w+l?Math.round(w/(w+l)*100):0;return `<div class="mt"><b>${n}</b><div><span>Richtig</span><em class="ok">${w}</em></div><div><span>Falsch</span><em class="no">${l}</em></div><div class="rate"><div class="track"><i style="width:${r}%;background:${r>=(k=="ht"||k=="ht2"?40:50)?'linear-gradient(90deg,var(--cy),var(--vi))':'var(--rd)'}"></i></div><strong>${w+l?r+'%':'–'}</strong></div></div>`}).join("")}</div></div>
 ${valueBilanz(fertig)}
 <p class="hint" style="margin-top:10px">Zur Einordnung: Halbzeit-Tipps treffen seltener als 1X2, weil das Remis zur Pause sehr häufig ist. Tippe im Ranking auf ein Modell, um seine Details zu sehen. RPS misst, wie gut die 1X2-Wahrscheinlichkeiten insgesamt waren, nicht nur der Favorit: kleiner ist besser, ein Münzwurf-Niveau liegt bei etwa 0,23.</p>`}

/* Value-Bilanz: Vorteil-Tipps des Modells gegen echte Ergebnisse, 1 Einheit Einsatz je Tipp */
function valueBilanz(list){let gw=0,gn=0,gp=0,geschaetzt=false;
 const zeilen=VTM.map(([k,n])=>{let w=0,c=0,pr=0;for(const s of list){const v=P(s).vt&&P(s).vt[k],r=res(s);if(!v||!r)continue;const h=vhit(k,v[0],r);if(h==null)continue;const[q,echt]=vquote(s,k,v);if(!echt)geschaetzt=true;c++;if(h){w++;pr+=q-1}else pr-=1}
  gw+=w;gn+=c;gp+=pr;return[n,w,c,pr]});
 const roi=(p,c)=>c?(p>=0?"+":"")+Math.round(p/c*100)+"%":"–";
 return `<h3>💰 Value-Bilanz <span>${M().kurz} · ${gn} Tipps</span></h3><div class="card" style="padding:6px 14px">
 <div class="trow" style="cursor:default"><div class="tl"><b>Gesamt</b><small>${gw} von ${gn} getroffen · Gewinn ${kom(gp.toFixed(1))} Einheiten</small></div><div class="tr"><span class="vbad ${gp>=0?'mk':'md'}">ROI ${roi(gp,gn)}</span></div></div>
 ${zeilen.map(([n,w,c,pr])=>`<div class="trow" style="cursor:default"><div class="tl"><b>${n}</b><small>${c?`${w} / ${c} getroffen · ${kom(pr.toFixed(1))} Einh.`:"keine Vorteil-Tipps"}</small></div><div class="tr"><b class="mono" style="font-size:13px">${roi(pr,c)}</b></div></div>`).join("")}</div>
 <p class="hint">Einsatz je Tipp 1 Einheit. 1X2 und OVER/UNDER mit echter Quote${geschaetzt?", BTTS und Halbzeiten mit geschätzter Markt-Quote ohne Marge (echte Quoten liegen etwas darunter)":""}. Eine Woche ist wenig – aussagekräftig erst über viele Wochen.</p>`}

/* ---------- Matrix-Code-Regen ---------- */
const MXZ="01アイウエオカキクケコサシスセソ<>{}=+*#ΣλØ01";
function mxStart(){document.querySelectorAll("canvas[data-mx]").forEach(c=>{if(c._on)return;c._on=1;const x=c.getContext("2d");let cols=[],w,h,fs=12;
 function size(){w=c.width=c.offsetWidth*devicePixelRatio;h=c.height=c.offsetHeight*devicePixelRatio;fs=15*devicePixelRatio;cols=Array(Math.ceil(w/fs)).fill(0).map(()=>Math.random()*-h/fs)}
 size();let t=0;function f(){if(!c.isConnected)return;if(c.offsetWidth*devicePixelRatio!=w)size();
  if(t++%5==0){const col=getComputedStyle(document.documentElement).getPropertyValue("--cy").trim()||"#22e4ff";
   x.fillStyle="rgba(5,6,15,.12)";x.fillRect(0,0,w,h);x.font=fs+"px JetBrains Mono, monospace";
   cols.forEach((y,i)=>{const ch=MXZ[Math.floor(Math.random()*MXZ.length)];x.fillStyle=Math.random()<.08?"#ffffff":col;x.globalAlpha=.75;x.fillText(ch,i*fs,y*fs);x.globalAlpha=1;
    cols[i]=y*fs>h&&Math.random()>.97?0:y+1})}requestAnimationFrame(f)}f()})}
/* ---------- Steuerung ---------- */
document.querySelectorAll("#ptabs div").forEach(n=>n.onclick=()=>{S.seite=n.dataset.p;S.detail=null;render();scrollTo(0,0)});
function render(){if(S.seite!="detail")theme(M());renderDays();renderSwitch();
 ["spiele","detail","top","values","bilanz"].forEach(k=>$("p-"+k).style.display=k==S.seite?"":"none");
 $("mswitch").style.display=S.seite=="detail"||S.seite=="values"||S.seite=="top"?"none":"";$("days").style.display=S.seite=="bilanz"||S.seite=="detail"?"none":"";
 document.querySelectorAll("#ptabs div").forEach(n=>n.classList.toggle("on",n.dataset.p==S.seite||(S.seite=="detail"&&n.dataset.p=="spiele")));
 if(S.seite=="spiele")renderSpiele();if(S.seite=="detail"){renderDetail();setTimeout(mxStart,30)}if(S.seite=="top")renderTop();if(S.seite=="values")renderValues();if(S.seite=="bilanz")renderBilanz()}
function start(j){D=j;D.laender.forEach(l=>l.ligen.forEach(g=>ligaInfo[g.code]=g.name));S.modell=D.modelle[0].id;
 const tage=[...new Set(D.spiele.map(s=>s.datum))].sort();S.tag=tage.includes(D.stand)?D.stand:(tage.find(d=>d>=D.stand)||tage[tage.length-1]);
 setTimeout(mxStart,50);$("stand").textContent="STAND "+dm(D.stand)+" · DATEN BIS "+dm(D.daten_bis);
 render()}
if(window.__DEMO__)start(window.__DEMO__);else fetch("daten.json?v="+Date.now()).then(r=>r.json()).then(start).catch(()=>{$("stand").textContent="DATEN NICHT GEFUNDEN"});
</script>
